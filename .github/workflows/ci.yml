name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 一个 module：窗口版要 MyGo，命令行跟着用同一个工具链。
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: 命令行不链接第三方代码
        # 模块里有了 MyGo（给窗口版用），但命令行的导入图里不能出现它：
        # 「单个静态二进制、不带运行环境」这条是对命令行的承诺。
        run: |
          deps=$(go list -deps ./cmd/dlg ./pkg/dlg)
          if echo "$deps" | grep -q 'github.com/egoist/mygo'; then
            echo "命令行或库层不应依赖 MyGo，实际依赖："
            echo "$deps" | grep 'github.com/egoist/mygo'
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # macOS ARM runner 上 -race 编出来的测试二进制缺 LC_UUID，dyld 加载即 abort，
      # 属于平台问题而非代码问题，因此只在其他平台启用竞态检测。
      #
      # 窗口版的视图测试（gui）只在 macOS 上跑：它在内存里渲染真实字体，Linux 与
      # Windows 的 runner 上还没验证过。命令行与库层的测试三个平台都跑。
      - name: go test
        if: runner.os != 'macOS'
        run: go test -race ./internal/... ./pkg/... ./cmd/...
      - name: go test (macOS)
        if: runner.os == 'macOS'
        run: go test ./...
      - name: 跨平台构建校验
        run: |
          go build -trimpath -o /dev/null ./cmd/dlg
          go build -trimpath -o /dev/null ./gui

  gui:
    name: 桌面客户端（macOS）
    # 打包、mygo vet、深色浅色截图都依赖 macOS 上的字体与图形栈。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go tool mygo vet
        run: cd gui && go tool mygo vet .
      - name: 打包校验
        run: cd gui && go tool mygo build -platform darwin/arm64 -skip-dmg
